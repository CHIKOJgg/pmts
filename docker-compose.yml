version: "3.9"

services:
  pmts:
    build: .
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - LOG_FORMAT=json
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: ["--mode", "live"]

  pmts-backtest:
    build: .
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - LOG_FORMAT=text
    command: ["--mode", "backtest", "--ticks", "5000", "--capital", "10000", "--verbose"]
    profiles: ["backtest"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pmts
      POSTGRES_PASSWORD: pmts
      POSTGRES_DB: pmts
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmts"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles: ["full"]

volumes:
  logs:
