version: "3.9"

services:
  pmts:
    build: .
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - LOG_FORMAT=json
    volumes:
      - ./logs:/app/logs
    ports:
      - "8080:8080"
    restart: unless-stopped
    command: ["--mode", "live"]

  pmts-backtest:
    build: .
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - LOG_FORMAT=text
    command: ["--mode", "backtest", "--ticks", "5000", "--capital", "10000", "--verbose"]
    profiles: ["backtest"]

volumes:
  logs:
