version: "3.9"

services:
  # ────────────────────────────────────────────────────────────────────────────
  # PMTS — основной сервис торговой системы
  # ────────────────────────────────────────────────────────────────────────────
  pmts:
    build: .
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - LOG_FORMAT=json
      - OBSERVABILITY_BIND_HOST=0.0.0.0
      # Путь к БД внутри контейнера (соответствует DB_PATH из .env)
      - DB_PATH=/app/data/portfolio.db
    volumes:
      # Логи — сохраняем на хост для просмотра
      - ./logs:/app/logs
      # Данные (SQLite) — сохраняем между перезапусками
      - pmts-data:/app/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    # По умолчанию paper-режим. Для live замените на --mode live
    # и переключите ENABLE_TRADING=true в .env
    command: ["--mode", "paper"]
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ────────────────────────────────────────────────────────────────────────────
  # Prometheus — сбор метрик (опционально)
  # ────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./docs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    profiles:
      - monitoring

  # ────────────────────────────────────────────────────────────────────────────
  # Grafana — визуализация метрик (опционально)
  # ────────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Пароль задаётся через .env или export:
      #   GF_SECURITY_ADMIN_PASSWORD=secure_password
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docs/grafana-dashboard.json:/var/lib/grafana/dashboards/pmts-dashboard.json:ro
      - ./docs/grafana-provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./docs/grafana-provisioning/dashboards/default.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
    profiles:
      - monitoring

  # ────────────────────────────────────────────────────────────────────────────
  # Backtest — разовый запуск бэктеста
  #   docker compose --profile backtest up pmts-backtest
  # ────────────────────────────────────────────────────────────────────────────
  pmts-backtest:
    build: .
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - LOG_FORMAT=text
    command: ["--mode", "backtest", "--ticks", "5000", "--capital", "10000", "--verbose"]
    profiles:
      - backtest

volumes:
  pmts-data:
  prometheus-data:
  grafana-data:
