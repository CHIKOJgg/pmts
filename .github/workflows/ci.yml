name: CI

on:
  push:
    branches: [main, dev, "0*", "**/fix*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff mypy

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy, strict)
        run: mypy src config data engine strategies risk execution portfolio ai backtest infrastructure
        continue-on-error: true

      - name: Run tests
        env:
          PYTHONPATH: .
          # Generate a throwaway kill-switch token so config validation passes
          KILL_SWITCH_TOKEN: ci-token-00000000000000000000000000000000
          MARKETS: BTC-Q4,ETH-Q1,SOL-Q2
        run: pytest tests/ -p no:cacheprovider -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pmts:ci .
