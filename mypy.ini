[mypy]
python_version = 3.11
strict = true
ignore_missing_imports = true
exclude = tests/|scripts/|backtest/

# Handle duplicate module names
[mypy-data.models]
[mypy-execution.models]

# Allow Any for external dependencies where stubs may be missing
[mypy-aiohttp.*]
ignore_missing_imports = true

[mypy-websockets.*]
ignore_missing_imports = true

[mypy-eth_account.*]
ignore_missing_imports = true

[mypy-pydantic.*]
ignore_missing_imports = true